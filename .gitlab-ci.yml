# Celestial Intelligence Copilot — GitLab Pages deployment
# Published at https://celestialintelligence.gitlab.io/copilot
image: node:22

stages:
  - build
  - deploy

variables:
  NODE_OPTIONS: "--max-old-space-size=4096"

cache:
  key:
    files:
      - bun.lock
      - package-lock.json
  paths:
    - node_modules/
    - .npm/

.install: &install
  - |
    if [ -f bun.lock ] || [ -f bun.lockb ]; then
      npm install -g bun
      bun install --frozen-lockfile
    elif [ -f pnpm-lock.yaml ]; then
      corepack enable && corepack prepare pnpm@latest --activate
      pnpm install --frozen-lockfile
    elif [ -f package-lock.json ]; then
      npm ci --cache .npm --prefer-offline
    else
      npm install
    fi

build:
  stage: build
  script:
    - *install
    # Derive the real deploy base path + origin from the Pages URL GitLab assigns.
    # Unique-domain pages ("https://copilot-182fec.gitlab.io") => base "/",
    # classic subpath pages ("https://group.gitlab.io/copilot") => base "/copilot/".
    - |
      PAGES_URL="${CI_PAGES_URL%/}"
      SITE_ORIGIN="$(echo "$PAGES_URL" | sed -E 's#^(https?://[^/]+).*#\1#')"
      BASE_PATH="$(echo "$PAGES_URL" | sed -E 's#^https?://[^/]+##')/"
      export PUBLIC_BASE_PATH="$BASE_PATH"
      export VITE_SITE_URL="$PAGES_URL"
      echo "base=$PUBLIC_BASE_PATH site=$VITE_SITE_URL"
      npm run build
    # Locate the static client output produced by the build.
    - |
      if [ -d .output/public ]; then OUT=.output/public;
      elif [ -d dist/client ]; then OUT=dist/client;
      elif [ -d dist ]; then OUT=dist;
      else echo "No build output found" && exit 1; fi
      echo "Using build output: $OUT"
      rm -rf build-output && mkdir -p build-output
      # Static assets from public/ first, then the build output wins on conflicts.
      cp -r public/. build-output/ 2>/dev/null || true
      cp -r "$OUT"/. build-output/
      # Point static metadata files at the real Pages origin/base path.
      PAGES_URL="${CI_PAGES_URL%/}"
      BASE_PATH="$(echo "$PAGES_URL" | sed -E 's#^https?://[^/]+##')/"
      sed -i "s#https://copilot-182fec.gitlab.io#${PAGES_URL}#g" build-output/robots.txt build-output/sitemap.xml 2>/dev/null || true
      sed -i "s#\"/#\"${BASE_PATH}#g; s#${BASE_PATH}${BASE_PATH#/}#${BASE_PATH}#g" build-output/manifest.json 2>/dev/null || true
      # SPA fallback for routes that are not prerendered (e.g. /dashboard).
      [ -f build-output/index.html ] && cp build-output/index.html build-output/404.html
  artifacts:
    paths:
      - build-output
    expire_in: 1 week

pages:
  stage: deploy
  dependencies:
    - build
  script:
    - rm -rf public
    - mv build-output public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
